name: LoopOS UI

on:
  pull_request:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: Install UI dependencies
        working-directory: ui
        run: npm ci
      - name: Install browser
        working-directory: ui
        run: npx playwright install --with-deps chromium
      - name: Install authority dependencies
        run: python -m pip install --requirement authority/requirements.txt
      - name: Verify corpus
        run: python scripts/validate_loop_corpus.py
      - name: Governed authority tests
        env:
          PYTHONPATH: authority
        run: python -m unittest discover -s authority/tests -v
      - name: Audit loop practicality
        run: python scripts/audit_loop_practicality.py
      - name: Unit and integration tests
        working-directory: ui
        run: npm test
      - name: Design token conformance
        working-directory: ui
        run: npm run lint:design
      - name: Production build
        working-directory: ui
        run: npm run build
      - name: Browser tests
        working-directory: ui
        run: npm run test:e2e
      - name: Dependency audit
        working-directory: ui
        run: npm audit --audit-level=high
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4.0.0
      - name: Build attested UI OCI image
        run: |
          mkdir -p .release-evidence
          docker buildx build \
            --file ui/Dockerfile \
            --tag loopos-ui:${{ github.sha }} \
            --provenance=mode=max \
            --sbom=true \
            --output type=oci,dest=.release-evidence/loopos-ui.oci.tar \
            .
      - name: Build attested authority OCI image
        run: |
          docker buildx build \
            --file authority/Dockerfile \
            --tag loopos-authority:${{ github.sha }} \
            --provenance=mode=max \
            --sbom=true \
            --output type=oci,dest=.release-evidence/loopos-authority.oci.tar \
            .
      - name: Verify OCI release evidence
        run: |
          python scripts/verify_oci_attestations.py \
            .release-evidence/loopos-ui.oci.tar \
            .release-evidence/loopos-authority.oci.tar \
            --output .release-evidence/manifest.json
      - name: Scan UI image vulnerabilities
        uses: anchore/scan-action@e1165082ffb1fe366ebaf02d8526e7c4989ea9d2 # v7.4.0
        with:
          sbom: .release-evidence/loopos-ui.sbom.spdx.json
          fail-build: true
          severity-cutoff: high
          cache-db: true
          output-format: json
          output-file: .release-evidence/loopos-ui.vulnerabilities.json
      - name: Scan authority image vulnerabilities
        uses: anchore/scan-action@e1165082ffb1fe366ebaf02d8526e7c4989ea9d2 # v7.4.0
        with:
          sbom: .release-evidence/loopos-authority.sbom.spdx.json
          fail-build: true
          severity-cutoff: high
          cache-db: true
          output-format: json
          output-file: .release-evidence/loopos-authority.vulnerabilities.json
      - name: Retain OCI release evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: loopos-release-evidence-${{ github.sha }}
          path: .release-evidence
          if-no-files-found: warn
          include-hidden-files: true
          retention-days: 30
