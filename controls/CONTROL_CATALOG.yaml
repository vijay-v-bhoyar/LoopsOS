version: 1.0
controls:
  -
    control_id: LC-001
    control_name: "Loop ID"
    section_key: A
    section_name: Identity
    minimum_risk_tier: R0
    applies_when: "Every loop."
    minimum_proof: "STATIC: unique, stable ID appears in descriptor, logs, evidence, and verdicts."
    proof_required: STATIC
  -
    control_id: LC-002
    control_name: "Loop name"
    section_key: A
    section_name: Identity
    minimum_risk_tier: R0
    applies_when: "Every loop."
    minimum_proof: "STATIC: unique human-readable name matches the canonical catalog."
    proof_required: STATIC
  -
    control_id: LC-003
    control_name: Category
    section_key: A
    section_name: Identity
    minimum_risk_tier: R0
    applies_when: "Every loop."
    minimum_proof: "STATIC: category is declared and used consistently in portfolio views."
    proof_required: STATIC
  -
    control_id: LC-004
    control_name: Version
    section_key: A
    section_name: Identity
    minimum_risk_tier: R1
    applies_when: "The loop is reused, governed, automated, or deployed."
    minimum_proof: "STATIC plus change test: version changes are recorded and referenced by executions."
    proof_required: "STATIC plus change test"
  -
    control_id: LC-005
    control_name: "Lifecycle status"
    section_key: A
    section_name: Identity
    minimum_risk_tier: R1
    applies_when: "The loop can be piloted, restricted, paused, deprecated, or retired."
    minimum_proof: "STATIC plus transition evidence: status changes follow the authoritative lifecycle rule."
    proof_required: "STATIC plus transition evidence"
  -
    control_id: LC-006
    control_name: "Effective date"
    section_key: A
    section_name: Identity
    minimum_risk_tier: R1
    applies_when: "A version or policy change becomes operational."
    minimum_proof: "STATIC: effective date is recorded and prior proof is invalidated when required."
    proof_required: STATIC
  -
    control_id: LC-007
    control_name: Purpose
    section_key: B
    section_name: "Purpose and Boundaries"
    minimum_risk_tier: R0
    applies_when: "Every loop."
    minimum_proof: "STATIC: concise statement explains why the loop exists."
    proof_required: STATIC
  -
    control_id: LC-008
    control_name: "Outcome to improve"
    section_key: B
    section_name: "Purpose and Boundaries"
    minimum_risk_tier: R0
    applies_when: "Every loop."
    minimum_proof: "STATIC plus metric link: one primary measurable outcome is named."
    proof_required: "STATIC plus metric link"
  -
    control_id: LC-009
    control_name: "Business value"
    section_key: B
    section_name: "Purpose and Boundaries"
    minimum_risk_tier: R0
    applies_when: "The loop consumes material time, cost, or authority."
    minimum_proof: "STATIC: value or avoided loss is stated and reviewable."
    proof_required: STATIC
  -
    control_id: LC-010
    control_name: "Risk reduced"
    section_key: B
    section_name: "Purpose and Boundaries"
    minimum_risk_tier: R1
    applies_when: "The loop is a control or gate."
    minimum_proof: "STATIC: risk statement maps to the risk register or control objective."
    proof_required: STATIC
  -
    control_id: LC-011
    control_name: Scope
    section_key: B
    section_name: "Purpose and Boundaries"
    minimum_risk_tier: R0
    applies_when: "Every loop."
    minimum_proof: "STATIC plus qualification probe: included products, systems, environments, users, and actions are identifiable."
    proof_required: "STATIC plus qualification probe"
  -
    control_id: LC-012
    control_name: Exclusions
    section_key: B
    section_name: "Purpose and Boundaries"
    minimum_risk_tier: R0
    applies_when: "Adjacent loops or skills exist."
    minimum_proof: "STATIC plus routing probe: out-of-scope cases are rejected or routed correctly."
    proof_required: "STATIC plus routing probe"
  -
    control_id: LC-013
    control_name: Stakeholders
    section_key: B
    section_name: "Purpose and Boundaries"
    minimum_risk_tier: R1
    applies_when: "The loop affects teams, users, customers, or governance authorities."
    minimum_proof: "STATIC: accountable and informed parties are mapped."
    proof_required: STATIC
  -
    control_id: LC-014
    control_name: "Systems and data covered"
    section_key: B
    section_name: "Purpose and Boundaries"
    minimum_risk_tier: R1
    applies_when: "The loop reads, writes, validates, or governs systems or data."
    minimum_proof: "STATIC plus inventory reconciliation: covered assets match authoritative inventories."
    proof_required: "STATIC plus inventory reconciliation"
  -
    control_id: LC-015
    control_name: "Event triggers"
    section_key: C
    section_name: "Trigger and Qualification"
    minimum_risk_tier: R0
    applies_when: "The loop reacts to events or changes."
    minimum_proof: "INTEGRATION_PROBE: each required event starts one qualified execution."
    proof_required: INTEGRATION_PROBE
  -
    control_id: LC-016
    control_name: "Scheduled cadence"
    section_key: C
    section_name: "Trigger and Qualification"
    minimum_risk_tier: R0
    applies_when: "The loop has periodic obligations."
    minimum_proof: "SCHEDULE_PROBE: scheduled execution occurs within the permitted window."
    proof_required: SCHEDULE_PROBE
  -
    control_id: LC-017
    control_name: "Threshold triggers"
    section_key: C
    section_name: "Trigger and Qualification"
    minimum_risk_tier: R1
    applies_when: "Metrics or risk thresholds start the loop."
    minimum_proof: "BOUNDARY_PROBE: below-threshold events do not start it and above-threshold events do."
    proof_required: BOUNDARY_PROBE
  -
    control_id: LC-018
    control_name: "Emergency trigger"
    section_key: C
    section_name: "Trigger and Qualification"
    minimum_risk_tier: R2
    applies_when: "Delay could materially increase loss, outage, or harm."
    minimum_proof: "NEGATIVE_PROBE or drill: emergency conditions bypass normal cadence and invoke the correct authority."
    proof_required: "NEGATIVE_PROBE or drill"
  -
    control_id: LC-019
    control_name: "Applicability rules"
    section_key: C
    section_name: "Trigger and Qualification"
    minimum_risk_tier: R0
    applies_when: "Every loop."
    minimum_proof: "DECISION_PROBE: in-scope and out-of-scope examples are classified correctly."
    proof_required: DECISION_PROBE
  -
    control_id: LC-020
    control_name: "Deduplication rules"
    section_key: C
    section_name: "Trigger and Qualification"
    minimum_risk_tier: R1
    applies_when: "The same event can arrive more than once."
    minimum_proof: "REPLAY_PROBE: duplicate triggers create one logical execution or return the prior result."
    proof_required: REPLAY_PROBE
  -
    control_id: LC-021
    control_name: "Entry criteria"
    section_key: C
    section_name: "Trigger and Qualification"
    minimum_risk_tier: R0
    applies_when: "Every loop."
    minimum_proof: "BOUNDARY_PROBE: the loop starts only when minimum conditions are met."
    proof_required: BOUNDARY_PROBE
  -
    control_id: LC-022
    control_name: Preconditions
    section_key: C
    section_name: "Trigger and Qualification"
    minimum_risk_tier: R1
    applies_when: "The loop performs state-changing or dependency-sensitive work."
    minimum_proof: "NEGATIVE_PROBE: missing permission, backup, dependency, or environment blocks execution safely."
    proof_required: NEGATIVE_PROBE
  -
    control_id: LC-023
    control_name: "Required inputs"
    section_key: D
    section_name: "Inputs and Dependencies"
    minimum_risk_tier: R0
    applies_when: "Every loop."
    minimum_proof: "SCHEMA_PROBE: missing or malformed required input is rejected with a named failure."
    proof_required: SCHEMA_PROBE
  -
    control_id: LC-024
    control_name: "Optional inputs"
    section_key: D
    section_name: "Inputs and Dependencies"
    minimum_risk_tier: R0
    applies_when: "Optional context can improve the decision."
    minimum_proof: "UNIT_PROBE: absence does not break the loop and presence is handled predictably."
    proof_required: UNIT_PROBE
  -
    control_id: LC-025
    control_name: "Authoritative sources"
    section_key: D
    section_name: "Inputs and Dependencies"
    minimum_risk_tier: R1
    applies_when: "More than one source or system can supply evidence."
    minimum_proof: "SOURCE-PRIORITY_PROBE: authoritative source wins or material conflict escalates."
    proof_required: SOURCE-PRIORITY_PROBE
  -
    control_id: LC-026
    control_name: "Input-quality checks"
    section_key: D
    section_name: "Inputs and Dependencies"
    minimum_risk_tier: R1
    applies_when: "Decisions depend on external, user, model, or operational data."
    minimum_proof: "NEGATIVE_PROBE: incomplete, stale, corrupted, or untrusted input is detected."
    proof_required: NEGATIVE_PROBE
  -
    control_id: LC-027
    control_name: "Freshness requirements"
    section_key: D
    section_name: "Inputs and Dependencies"
    minimum_risk_tier: R1
    applies_when: "Input can become stale."
    minimum_proof: "TIME-BOUNDARY_PROBE: current input passes and expired input is rejected or escalated."
    proof_required: TIME-BOUNDARY_PROBE
  -
    control_id: LC-028
    control_name: "Data lineage"
    section_key: D
    section_name: "Inputs and Dependencies"
    minimum_risk_tier: R2
    applies_when: "Data influences production, regulated, financial, AI, or audit decisions."
    minimum_proof: "REPRODUCTION_RUN: source, transformations, versions, and consumers can be traced."
    proof_required: REPRODUCTION_RUN
  -
    control_id: LC-029
    control_name: "Upstream dependencies"
    section_key: D
    section_name: "Inputs and Dependencies"
    minimum_risk_tier: R1
    applies_when: "Other skills, services, approvals, or data feeds are required."
    minimum_proof: "FAULT_INJECTION: unavailable or delayed upstream dependencies trigger the approved fallback or block."
    proof_required: FAULT_INJECTION
  -
    control_id: LC-030
    control_name: "Downstream consumers"
    section_key: D
    section_name: "Inputs and Dependencies"
    minimum_risk_tier: R1
    applies_when: "Other loops or systems consume the output."
    minimum_proof: "CONTRACT_PROBE: downstream receives the expected schema, status, and evidence reference."
    proof_required: CONTRACT_PROBE
  -
    control_id: LC-031
    control_name: "Interface contracts"
    section_key: D
    section_name: "Inputs and Dependencies"
    minimum_risk_tier: R1
    applies_when: "The loop exchanges machine-readable data or tool calls."
    minimum_proof: "INTEGRATION_PROBE: valid contracts pass and incompatible versions fail safely."
    proof_required: INTEGRATION_PROBE
  -
    control_id: LC-032
    control_name: Baseline
    section_key: E
    section_name: "Outcome and Measurement"
    minimum_risk_tier: R1
    applies_when: "The loop claims improvement."
    minimum_proof: "STATIC plus reproducibility: the starting metric and source can be recalculated."
    proof_required: "STATIC plus reproducibility"
  -
    control_id: LC-033
    control_name: Target
    section_key: E
    section_name: "Outcome and Measurement"
    minimum_risk_tier: R1
    applies_when: "The loop claims success or readiness."
    minimum_proof: "STATIC: target, time horizon, population, and owner are explicit."
    proof_required: STATIC
  -
    control_id: LC-034
    control_name: "Leading metrics"
    section_key: E
    section_name: "Outcome and Measurement"
    minimum_risk_tier: R1
    applies_when: "Early process signals are useful."
    minimum_proof: "METRIC_RECALCULATION: formula and source reproduce the reported value."
    proof_required: METRIC_RECALCULATION
  -
    control_id: LC-035
    control_name: "Lagging metrics"
    section_key: E
    section_name: "Outcome and Measurement"
    minimum_risk_tier: R1
    applies_when: "The final outcome can be measured."
    minimum_proof: "SUSTAINED_MONITORING: outcome is measured over the required period."
    proof_required: SUSTAINED_MONITORING
  -
    control_id: LC-036
    control_name: "Guardrail metrics"
    section_key: E
    section_name: "Outcome and Measurement"
    minimum_risk_tier: R2
    applies_when: "Improving one outcome could harm another."
    minimum_proof: "CANARY or regression proof: primary improvement does not breach guardrails."
    proof_required: "CANARY or regression proof"
  -
    control_id: LC-037
    control_name: "Metric formulas"
    section_key: E
    section_name: "Outcome and Measurement"
    minimum_risk_tier: R1
    applies_when: "A metric is used by a gate, target, or report."
    minimum_proof: "RECALCULATION_PROBE: independent calculation matches within tolerance."
    proof_required: RECALCULATION_PROBE
  -
    control_id: LC-038
    control_name: "Observation window"
    section_key: E
    section_name: "Outcome and Measurement"
    minimum_risk_tier: R2
    applies_when: "The outcome is not immediately observable."
    minimum_proof: "TIME-WINDOW_PROBE: early closure is blocked and the final review occurs by deadline."
    proof_required: TIME-WINDOW_PROBE
  -
    control_id: LC-039
    control_name: "Minimum sample size"
    section_key: E
    section_name: "Outcome and Measurement"
    minimum_risk_tier: R2
    applies_when: "Statistical or traffic-based evidence is required."
    minimum_proof: "STATISTICAL_OBSERVATION: pass is withheld until the floor is met or an explicit insufficient-evidence state occurs."
    proof_required: STATISTICAL_OBSERVATION
  -
    control_id: LC-040
    control_name: "Quality thresholds"
    section_key: E
    section_name: "Outcome and Measurement"
    minimum_risk_tier: R1
    applies_when: "The loop makes pass, block, or remediation decisions."
    minimum_proof: "BOUNDARY_PROBE: values around each threshold produce the expected verdict."
    proof_required: BOUNDARY_PROBE
  -
    control_id: LC-041
    control_name: "Assessment rules"
    section_key: F
    section_name: "Decision Design"
    minimum_risk_tier: R1
    applies_when: "The loop classifies findings or evidence."
    minimum_proof: "DECISION_TABLE_PROBE: representative cases produce expected classifications."
    proof_required: DECISION_TABLE_PROBE
  -
    control_id: LC-042
    control_name: "Risk classification"
    section_key: F
    section_name: "Decision Design"
    minimum_risk_tier: R1
    applies_when: "Control depth changes with execution risk."
    minimum_proof: "SCENARIO_PROBE: changes in data, privilege, reversibility, or blast radius raise the tier correctly."
    proof_required: SCENARIO_PROBE
  -
    control_id: LC-043
    control_name: "Prioritization method"
    section_key: F
    section_name: "Decision Design"
    minimum_risk_tier: R1
    applies_when: "Multiple findings compete for action."
    minimum_proof: "RECALCULATION_PROBE: ranking is reproducible and tie rules are applied."
    proof_required: RECALCULATION_PROBE
  -
    control_id: LC-044
    control_name: "Confidence threshold"
    section_key: F
    section_name: "Decision Design"
    minimum_risk_tier: R2
    applies_when: "Uncertain evidence could cause a consequential decision."
    minimum_proof: "BOUNDARY_PROBE: low confidence defers or escalates and sufficient confidence permits the defined action."
    proof_required: BOUNDARY_PROBE
  -
    control_id: LC-045
    control_name: "Allowed decisions"
    section_key: F
    section_name: "Decision Design"
    minimum_risk_tier: R1
    applies_when: "The loop returns a verdict or action status."
    minimum_proof: "SCHEMA_PROBE: only controlled outcomes are emitted."
    proof_required: SCHEMA_PROBE
  -
    control_id: LC-046
    control_name: "Decision authority"
    section_key: F
    section_name: "Decision Design"
    minimum_risk_tier: R2
    applies_when: "The loop can approve, block, promote, accept risk, or change production."
    minimum_proof: "AUTHORIZATION_PROBE: unauthorized actors cannot issue the verdict and authorized decisions are attributable."
    proof_required: AUTHORIZATION_PROBE
  -
    control_id: LC-047
    control_name: "Exception process"
    section_key: F
    section_name: "Decision Design"
    minimum_risk_tier: R2
    applies_when: "A required control can be temporarily unmet."
    minimum_proof: "EXPIRY_PROBE: exception requires authority, compensating controls, and a hard expiry."
    proof_required: EXPIRY_PROBE
  -
    control_id: LC-048
    control_name: "Residual-risk acceptance"
    section_key: F
    section_name: "Decision Design"
    minimum_risk_tier: R3
    applies_when: "Material risk remains after remediation."
    minimum_proof: "AUTHORIZATION_PROBE: only the named risk owner can accept it and the acceptance expires or is reviewed."
    proof_required: AUTHORIZATION_PROBE
  -
    control_id: LC-049
    control_name: "Execution plan"
    section_key: G
    section_name: Execution
    minimum_risk_tier: R1
    applies_when: "The loop performs more than one step or changes state."
    minimum_proof: "STATIC plus dry run: sequence, owners, expected states, validation, and recovery are complete."
    proof_required: "STATIC plus dry run"
  -
    control_id: LC-050
    control_name: "Actions permitted"
    section_key: G
    section_name: Execution
    minimum_risk_tier: R0
    applies_when: "Every action-capable loop."
    minimum_proof: "ALLOWLIST_PROBE: approved actions succeed within scope."
    proof_required: ALLOWLIST_PROBE
  -
    control_id: LC-051
    control_name: "Actions prohibited"
    section_key: G
    section_name: Execution
    minimum_risk_tier: R0
    applies_when: "Every action-capable loop."
    minimum_proof: "NEGATIVE_PROBE: prohibited actions are blocked and audited."
    proof_required: NEGATIVE_PROBE
  -
    control_id: LC-052
    control_name: "Required permissions"
    section_key: G
    section_name: Execution
    minimum_risk_tier: R1
    applies_when: "The loop accesses systems, data, models, or tools."
    minimum_proof: "AUTHORIZATION_PROBE: least privilege is sufficient and excess or missing authority is detected."
    proof_required: AUTHORIZATION_PROBE
  -
    control_id: LC-053
    control_name: "Durable lifecycle events"
    section_key: G
    section_name: Execution
    minimum_risk_tier: R1
    applies_when: "Execution can pause, resume, fail, or span an observation period."
    minimum_proof: "RECOVERY_PROBE: state can be reconstructed and resumed without false completion."
    proof_required: RECOVERY_PROBE
  -
    control_id: LC-054
    control_name: Checkpoints
    section_key: G
    section_name: Execution
    minimum_risk_tier: R1
    applies_when: "Execution is long-running, multi-step, or partially reversible."
    minimum_proof: "FAULT_INJECTION: interruption resumes from the correct checkpoint without duplicate effects."
    proof_required: FAULT_INJECTION
  -
    control_id: LC-055
    control_name: Idempotency
    section_key: G
    section_name: Execution
    minimum_risk_tier: R1
    applies_when: "Actions can be retried, replayed, or duplicated."
    minimum_proof: "REPLAY_PROBE: repeated operation produces one logical effect."
    proof_required: REPLAY_PROBE
  -
    control_id: LC-056
    control_name: "Concurrency control"
    section_key: G
    section_name: Execution
    minimum_risk_tier: R2
    applies_when: "Parallel executions can touch shared state or conflicting resources."
    minimum_proof: "CONCURRENCY_PROBE: races, deadlocks, and conflicting writes are prevented or resolved."
    proof_required: CONCURRENCY_PROBE
  -
    control_id: LC-057
    control_name: "Resource budget"
    section_key: G
    section_name: Execution
    minimum_risk_tier: R1
    applies_when: "The loop consumes time, money, tokens, compute, calls, records, or human effort."
    minimum_proof: "LIMIT_PROBE: the loop stops or escalates before exceeding each bound."
    proof_required: LIMIT_PROBE
  -
    control_id: LC-058
    control_name: Timeouts
    section_key: G
    section_name: Execution
    minimum_risk_tier: R1
    applies_when: "External calls or steps can hang."
    minimum_proof: "FAULT_INJECTION: timeout cancels or isolates the step and preserves known state."
    proof_required: FAULT_INJECTION
  -
    control_id: LC-059
    control_name: "Retry and backoff"
    section_key: G
    section_name: Execution
    minimum_risk_tier: R1
    applies_when: "Transient failures are possible."
    minimum_proof: "FAULT_INJECTION: transient errors retry within policy and deterministic errors do not."
    proof_required: FAULT_INJECTION
  -
    control_id: LC-060
    control_name: "Circuit breaker"
    section_key: G
    section_name: Execution
    minimum_risk_tier: R2
    applies_when: "Repeated failure could amplify harm or load."
    minimum_proof: "FAULT_INJECTION: breaker opens, cools down, and recovers according to the authoritative contract."
    proof_required: FAULT_INJECTION
  -
    control_id: LC-061
    control_name: "Human approval points"
    section_key: H
    section_name: "Human Control"
    minimum_risk_tier: R3
    applies_when: "The action is consequential, privileged, regulated, externally visible, or hard to reverse."
    minimum_proof: "AUTHORIZATION_PROBE: action cannot proceed without current approval."
    proof_required: AUTHORIZATION_PROBE
  -
    control_id: LC-062
    control_name: "Separation of duties"
    section_key: H
    section_name: "Human Control"
    minimum_risk_tier: R3
    applies_when: "One actor should not propose, approve, execute, validate, and accept risk."
    minimum_proof: "ROLE-CONFLICT_PROBE: prohibited role combinations are blocked."
    proof_required: ROLE-CONFLICT_PROBE
  -
    control_id: LC-063
    control_name: "Manual override"
    section_key: H
    section_name: "Human Control"
    minimum_risk_tier: R2
    applies_when: "Automation can make a wrong or unsafe decision."
    minimum_proof: "OVERRIDE_DRILL: an authorized operator can pause or redirect the loop and the action is audited."
    proof_required: OVERRIDE_DRILL
  -
    control_id: LC-064
    control_name: "Kill switch"
    section_key: H
    section_name: "Human Control"
    minimum_risk_tier: R3
    applies_when: "The loop can cause fast, broad, or high-impact effects."
    minimum_proof: "KILL_SWITCH_DRILL: active execution stops, credentials are revoked where required, and restart needs approval."
    proof_required: KILL_SWITCH_DRILL
  -
    control_id: LC-065
    control_name: "Escalation path"
    section_key: H
    section_name: "Human Control"
    minimum_risk_tier: R1
    applies_when: "The loop can block, fail, conflict, or exceed limits."
    minimum_proof: "ROUTING_PROBE: each failure class reaches the correct authority within SLA."
    proof_required: ROUTING_PROBE
  -
    control_id: LC-066
    control_name: "Backup approver"
    section_key: H
    section_name: "Human Control"
    minimum_risk_tier: R2
    applies_when: "Approval delay could create operational or safety risk."
    minimum_proof: "AVAILABILITY_DRILL: backup authority can act without violating separation of duties."
    proof_required: AVAILABILITY_DRILL
  -
    control_id: LC-067
    control_name: "Failure taxonomy"
    section_key: I
    section_name: Recovery
    minimum_risk_tier: R1
    applies_when: "The loop can fail in more than one way."
    minimum_proof: "CLASSIFICATION_PROBE: representative failures map to named states and responses."
    proof_required: CLASSIFICATION_PROBE
  -
    control_id: LC-068
    control_name: "Safe failure state"
    section_key: I
    section_name: Recovery
    minimum_risk_tier: R2
    applies_when: "Failure could leave an unsafe, inconsistent, or externally harmful state."
    minimum_proof: "FAULT_INJECTION: the loop reaches the defined safe state."
    proof_required: FAULT_INJECTION
  -
    control_id: LC-069
    control_name: Rollback
    section_key: I
    section_name: Recovery
    minimum_risk_tier: R2
    applies_when: "The action is reversible and changes persistent or production state."
    minimum_proof: "ROLLBACK_DRILL: exact release or operation returns to an accepted prior state."
    proof_required: ROLLBACK_DRILL
  -
    control_id: LC-070
    control_name: Compensation
    section_key: I
    section_name: Recovery
    minimum_risk_tier: R2
    applies_when: "Direct rollback is impossible or incomplete."
    minimum_proof: "COMPENSATION_DRILL: corrective action restores the business invariant and records residual impact."
    proof_required: COMPENSATION_DRILL
  -
    control_id: LC-071
    control_name: "Fallback mode"
    section_key: I
    section_name: Recovery
    minimum_risk_tier: R2
    applies_when: "The preferred provider, model, tool, system, or data source can be unavailable."
    minimum_proof: "FAILOVER_DRILL: alternate or reduced mode works within declared limits."
    proof_required: FAILOVER_DRILL
  -
    control_id: LC-072
    control_name: "Recovery validation"
    section_key: I
    section_name: Recovery
    minimum_risk_tier: R2
    applies_when: "Rollback, compensation, or failover can itself be incomplete."
    minimum_proof: "INDEPENDENT_PROBE: recovered state, data consistency, and service health meet acceptance criteria."
    proof_required: INDEPENDENT_PROBE
  -
    control_id: LC-073
    control_name: "Validation method"
    section_key: J
