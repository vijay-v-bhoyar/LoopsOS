version: 1.0
invariant: "ACTION_APPLIED is never equivalent to EFFECTIVENESS_PROVEN"
terminal_states:
  - EFFECTIVENESS_PROVEN
  - EFFECTIVENESS_FAILED
  - BLOCKED
  - ROLLED_BACK
  - PAUSED
  - RETIRED
allowed_transitions:
  TRIGGERED:
    - QUALIFIED
    - INPUT_INCOMPLETE
    - BLOCKED
  QUALIFIED:
    - OBSERVED
    - INSUFFICIENT_EVIDENCE
    - BLOCKED
  OBSERVED:
    - DIAGNOSED
    - INPUT_STALE
    - INPUT_CONFLICTED
    - INPUT_UNTRUSTED
    - BLOCKED
  DIAGNOSED:
    - PRIORITIZED
    - INSUFFICIENT_EVIDENCE
    - BLOCKED
  PRIORITIZED:
    - PLANNED
    - PAUSED
    - BLOCKED
  PLANNED:
    - AUTHORIZED
    - BLOCKED
  AUTHORIZED:
    - ACTION_IN_PROGRESS
    - BLOCKED
  ACTION_IN_PROGRESS:
    - ACTION_APPLIED
    - VALIDATION_FAILED
    - ROLLED_BACK
    - BLOCKED
  ACTION_APPLIED:
    - VALIDATION_PASSED
    - VALIDATION_FAILED
    - ROLLED_BACK
    - BLOCKED
  VALIDATION_PASSED:
    - PROOF_GREEN
    - PROOF_FAILED
    - EFFECTIVENESS_PENDING
    - BLOCKED
  VALIDATION_FAILED:
    - PLANNED
    - ROLLED_BACK
    - BLOCKED
  PROOF_GREEN:
    - EFFECTIVENESS_PENDING
    - EFFECTIVENESS_PROVEN
    - BLOCKED
  PROOF_FAILED:
    - PLANNED
    - BLOCKED
    - ROLLED_BACK
  EFFECTIVENESS_PENDING:
    - EFFECTIVENESS_PROVEN
    - EFFECTIVENESS_FAILED
    - INSUFFICIENT_EVIDENCE
    - BLOCKED
  INSUFFICIENT_EVIDENCE:
    - OBSERVED
    - CONDITIONAL_ACTIVE
    - BLOCKED
  CONDITIONAL_ACTIVE:
    - EFFECTIVENESS_PENDING
    - CONDITIONAL_EXPIRED
    - BLOCKED
  CONDITIONAL_EXPIRED:
    - BLOCKED
    - PLANNED
